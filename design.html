<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>設計部待辦</title>
  <meta name="theme-color" content="#2459a6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-savebar">
  <header class="site-header">
    <nav class="site-nav" aria-label="頁面">
      <a href="index.html">報修登記</a>
      <a href="design.html" aria-current="page">設計部待辦</a>
      <button id="install-btn" type="button" class="secondary install-btn" hidden>安裝 App</button>
    </nav>
    <p id="offline-banner" class="message error offline-banner" role="status" hidden>目前離線：畫面可以開啟，但讀取與送出資料需要網路。</p>
    <h1>設計部待辦</h1>
    <p class="subtitle">從選單選擇項目，逐列填寫內容，完成的勾選「已完成」，最後按「確認送出」保存。</p>
  </header>

  <main>
    <div id="menu" class="menu" role="tablist" aria-label="待辦項目">
      <button type="button" role="tab" class="menu-item" data-tab="待規劃案件">
        <span class="menu-name">待規劃案件</span><span class="menu-count" data-count="待規劃案件">0</span>
      </button>
      <button type="button" role="tab" class="menu-item" data-tab="待計算數量案件">
        <span class="menu-name">待計算數量案件</span><span class="menu-count" data-count="待計算數量案件">0</span>
      </button>
      <button type="button" role="tab" class="menu-item" data-tab="計算書待計算案件">
        <span class="menu-name">計算書待計算案件</span><span class="menu-count" data-count="計算書待計算案件">0</span>
      </button>
      <button type="button" role="tab" class="menu-item menu-done" data-tab="已完成">
        <span class="menu-name">已完成</span><span class="menu-count" data-count="已完成">0</span>
      </button>
    </div>

    <section class="card" role="tabpanel" aria-labelledby="panel-title">
      <div class="list-head">
        <h2 id="panel-title">待規劃案件</h2>
        <button id="reload-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="panel-hint" class="hint-left"></p>
      <p id="list-message" class="message" role="status" aria-live="polite" hidden></p>
      <ol id="item-list" class="item-list"></ol>
      <button id="add-row-btn" type="button" class="secondary add-row">＋ 新增一列</button>
    </section>
  </main>

  <div class="savebar">
    <div class="savebar-inner">
      <p id="save-status" class="save-status" role="status" aria-live="polite">沒有未儲存的變更</p>
      <button id="save-btn" type="button">確認送出</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="pwa.js"></script>
  <script src="design.js"></script>
</body>
</html>
